name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # default is 6 h; apt has hung here before
    steps:
      - uses: actions/checkout@v6

      - name: Install zsh and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh ffmpeg

      # ShellCheck does not support zsh, so syntax check only.
      - name: Syntax check
        run: for f in prepare.sh record.command canva-cam.command; do zsh -n "$f"; done

      - name: Dialog flows (fake osascript)
        run: bash tests/dialogs.sh

      - name: prepare.sh with and without audio, long and short
        run: |
          set -eu
          MARGIN=5
          tmp=$(mktemp -d)
          for len in 12 4; do  # 4 s: shorter than the 10 s preview frame (#9)
            ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=320x240:rate=30:duration=$len" \
              -f lavfi -i "sine=frequency=440:duration=$len" -shortest "$tmp/audio-$len.mp4"
            ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=320x240:rate=30:duration=$len" \
              "$tmp/silent-$len.mp4"
          done
          for v in audio-12 silent-12 audio-4 silent-4; do
            echo "::group::$v"
            rm -rf media
            ./prepare.sh "$tmp/$v.mp4"
            test -s media/cam.mjpeg && test -s media/preview.png
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 media/mic.wav)
            expected=$((${v#*-} + MARGIN))
            echo "mic.wav: ${dur}s (expected ${expected}s)"
            awk -v d="$dur" -v e=$expected 'BEGIN { exit (d - e > 0.1 || e - d > 0.1) }'
            echo "::endgroup::"
          done

      - name: Preview only
        run: |
          set -eu
          rm -rf media
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=1080x1920:rate=30:duration=3" /tmp/v.mp4
          PREVIEW_ONLY=1 ./prepare.sh /tmp/v.mp4 250
          test -s media/preview.png && test ! -e media/cam.mjpeg

      - name: Bad input fails
        run: |
          echo "not a video" > /tmp/bad.mp4
          if ./prepare.sh /tmp/bad.mp4; then echo "should have failed"; exit 1; fi

      - name: record.command on Linux (fake Chrome)
        run: |
          set -eu
          mkdir -p media && touch media/cam.mjpeg media/mic.wav
          export LOG=$(mktemp)
          PATH="$PWD/tests/stubs:$PATH" zsh record.command http://127.0.0.1/test
          for _ in 1 2 3 4 5; do grep -q 127.0.0.1 "$LOG" && break; sleep 1; done
          cat "$LOG"
          grep -qx -- "--use-file-for-fake-video-capture=$PWD/media/cam.mjpeg" "$LOG"
          grep -qx -- "--use-file-for-fake-audio-capture=$PWD/media/mic.wav%noloop" "$LOG"
          grep -qx -- "--user-data-dir=$PWD/chrome-profile" "$LOG"
          grep -qx http://127.0.0.1/test "$LOG"

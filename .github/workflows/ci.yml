name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install zsh and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh ffmpeg

      # ShellCheck does not support zsh, so syntax check only.
      - name: Syntax check
        run: zsh -n prepare.sh && zsh -n record.command

      - name: prepare.sh with and without audio
        run: |
          set -eu
          LEN=12     # long enough for the preview frame at MARGIN + 10 s
          MARGIN=5
          tmp=$(mktemp -d)
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=320x240:rate=30:duration=$LEN" \
            -f lavfi -i "sine=frequency=440:duration=$LEN" -shortest "$tmp/with-audio.mp4"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=320x240:rate=30:duration=$LEN" \
            "$tmp/no-audio.mp4"
          for v in with-audio no-audio; do
            echo "::group::$v"
            rm -rf media
            ./prepare.sh "$tmp/$v.mp4"
            test -s media/cam.mjpeg && test -s media/preview.png
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 media/mic.wav)
            echo "mic.wav: ${dur}s (expected $((LEN + MARGIN))s)"
            awk -v d="$dur" -v e=$((LEN + MARGIN)) 'BEGIN { exit (d - e > 0.1 || e - d > 0.1) }'
            echo "::endgroup::"
          done
